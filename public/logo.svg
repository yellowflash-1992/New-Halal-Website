<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90" fill="none">
  <defs>
    <linearGradient id="emblemRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7a4a56" />
      <stop offset="50%" stopColor="#c97e8e" />
      <stop offset="100%" stopColor="#b06576" />
    </linearGradient>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f3e3cb" />
      <stop offset="100%" stopColor="#d4af37" />
    </linearGradient>
    <linearGradient id="emblemPetal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#7a4a56" />
      <stop offset="60%" stopColor="#c97e8e" />
      <stop offset="100%" stopColor="#e8a598" />
    </linearGradient>
    <linearGradient id="emblemLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8f6470" />
      <stop offset="100%" stopColor="#c97e8e" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GROUP (x=8, y=5) -->
  <g transform="translate(8, 5) scale(0.9)">
    <!-- 1. Graceful Islamic Crescent Moon -->
    <path d="M48 8 C25.9 8 8 25.9 8 48 C8 70.1 25.9 88 48 88 C34.5 80.5 25.5 65.5 25.5 48 C25.5 30.5 34.5 15.5 48 8 Z" fill="url(#emblemRose)" />

    <!-- 2. Botanical Laurel Sprigs -->
    <g fill="url(#emblemLeaf)">
      <path d="M22 23 C19 18 23 15 26 16 C26 20 23 22 22 23 Z" />
      <path d="M17 31 C14 27 16 23 20 23 C21 27 19 30 17 31 Z" />
      <path d="M17 65 C14 66 13 70 16 73 C18 71 19 68 17 65 Z" />
      <path d="M22 74 C20 77 22 81 26 80 C26 77 24 74 22 74 Z" />
    </g>

    <!-- 3. Blooming Wellness Lotus Blossom -->
    <g transform="translate(4, -1)">
      <path d="M52 24 C47 36 47 50 52 64 C57 50 57 36 52 24 Z" fill="url(#emblemPetal)" />
      <path d="M52 32 C49.5 40 49.5 50 52 58 C54.5 50 54.5 40 52 32 Z" fill="#ffffff" opacity="0.35" />
      <path d="M50 44 C38 46 29 55 34 67 C43 67 49 58 50 44 Z" fill="url(#emblemPetal)" opacity="0.9" />
      <path d="M54 44 C66 46 75 55 70 67 C61 67 55 58 54 44 Z" fill="url(#emblemPetal)" opacity="0.9" />
      <path d="M48 54 C36 59 30 68 36 74 C44 73 48 66 48 54 Z" fill="url(#emblemRose)" opacity="0.75" />
      <path d="M56 54 C68 59 74 68 68 74 C60 73 56 66 56 54 Z" fill="url(#emblemRose)" opacity="0.75" />
      <path d="M42 67 C48 71 56 71 62 67 C58 73 46 73 42 67 Z" fill="url(#emblemGold)" />
    </g>

    <!-- 4. Golden Star of Excellence -->
    <path d="M74 15 C74 18 75.5 19.5 78.5 19.5 C75.5 19.5 74 21 74 24 C74 21 72.5 19.5 69.5 19.5 C72.5 19.5 74 18 74 15 Z" fill="url(#emblemGold)" />
    <circle cx="83" cy="25" r="1.5" fill="url(#emblemGold)" opacity="0.85" />
    <circle cx="34" cy="16" r="1.2" fill="url(#emblemGold)" opacity="0.75" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(100, 20)">
    <text x="0" y="36" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#7a4a56" letter-spacing="-0.5">Halal</text>
    <text x="96" y="36" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="34" font-weight="700" fill="#c97e8e" letter-spacing="-0.5">Fit-Sis</text>
    <circle cx="204" cy="32" r="3.5" fill="#c97e8e" />
    <text x="2" y="52" font-family="'Nunito Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#8f6470" letter-spacing="3" text-transform="uppercase">SISTERHOOD &bull; WELLNESS</text>
  </g>
</svg>
